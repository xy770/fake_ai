<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake AI · 用不完的 Token</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="stage">
  <header class="top">
    <span class="badge">FAKE AI / 现场体验</span>
    <span class="wish">给自己的惊喜</span>
  </header>
  <section class="card">
    <div class="chat-head">
      <img class="frog" src="/favicon.svg" alt="frog">
      <span class="name">Fake AI</span>
      <span class="online"><i></i>在线</span>
    </div>
    <div class="chat-log" id="log"></div>
    <div class="chips" id="chips"></div>
    <form class="chat-input" id="form">
      <input id="box" autocomplete="off" placeholder="说点什么，比如：我今天好累">
      <button type="submit">发送</button>
    </form>
  </section>
  <p class="foot">它很笨，但它是我们做的。 · 想和世界上最帅的聊天：西电心理中心 E楼 207</p>
</main>
<script src="/app.js"></script>
</body>
</html>
